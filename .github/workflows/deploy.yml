name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current time
        id: time
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: docker build -t jwchat-frontend:latest -f Dockerfile.frontend --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} --build-arg NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }} ./frontend

      - name: Build backend image
        run: docker build -t jwchat-backend:latest -f Dockerfile.backend .

      - name: Save images to tar
        run: docker save jwchat-backend:latest jwchat-frontend:latest | gzip > jwchat-images.tar.gz

      - name: Upload images to VDS
        env:
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$VDS_SSH_KEY_B64" | base64 -d > ~/.ssh/vds_key
          chmod 600 ~/.ssh/vds_key
          ls -lh jwchat-images.tar.gz
          echo "Uploading jwchat-images.tar.gz (may take a while)..."
          for i in 1 2 3 4 5; do
            if scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -P ${{ secrets.VDS_PORT || 22 }} jwchat-images.tar.gz ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/tmp/jwchat-images.tar.gz; then
              echo "upload OK"
              break
            fi
            echo "scp attempt $i failed, retrying..."
            sleep 10
          done
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -p ${{ secrets.VDS_PORT || 22 }} ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "ls -lh /tmp/jwchat-images.tar.gz && gzip -t /tmp/jwchat-images.tar.gz && echo GZIP_OK"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -P ${{ secrets.VDS_PORT || 22 }} docker-compose.vds.yml ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/opt/jwchat/docker-compose.vds.yml
        timeout-minutes: 45

      - name: Load and redeploy on VDS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: "30m"
          script_stop: true
          script: |
            set -e
            cd /opt/jwchat
            docker load -i /tmp/jwchat-images.tar.gz
            docker compose -f docker-compose.vds.yml up -d
            docker compose -f docker-compose.vds.yml ps

      - name: Report result
        if: always()
        run: echo "Deploy ${{ job.status }} at ${{ steps.time.outputs.now }}"