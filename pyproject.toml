[tool.poetry]
name = "jw-chat"
version = "1.0.0"
description = "JOIN WORK! — Modern Real-Time Chat"
authors = ["JOIN WORK! Team"]
readme = "README.md"
packages = [{ include = "." }]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1"
channels = "^4.1"
channels-redis = "^4.2"
daphne = "^4.1"
psycopg2-binary = "^2.9"
redis = "^5.0"
djangorestframework = "^3.15"
django-cors-headers = "^4.4"
django-filter = "^24.3"
pillow = "^10.4"
python-dotenv = "^1.0"
gunicorn = "^22.0"
httpx = "^0.28"
SpeechRecognition = "^3.10"
pydub = "^0.25"
imageio-ffmpeg = "^0.6"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5"
pre-commit = "^3.7"
pytest = "^8.2"
pytest-django = "^4.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
