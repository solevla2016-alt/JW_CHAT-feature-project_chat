# HTTPS-конфиг. Подключается ТОЛЬКО после того, как certbot выпустил сертификат:
#   docker compose -f docker-compose.vds.yml exec backend certbot ... (см. DEPLOY.md)
# Затем раскомментируйте mount в docker-compose.vds.yml и перезапустите nginx.
#
# Обратите внимание: блок на :80 здесь НЕ нужен — базовый nginx.conf уже обслуживает
# :80 (ACME-challenge, редиректы фронта/API/WS). Этот файл добавляет только :443.

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # REST API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Медиа
    location /media/ {
        alias /app/media/;
    }

    # WebSocket (чат + звонки)
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Фронт
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}